[project]
name = "galaxy-buds-multipoint-tray"
version = "0.1.0"
description = "Compact Windows tray-app die automatisch de Galaxy Buds multipoint-fix (asVer=2 via SPPSERVICE4) toepast bij iedere Bluetooth-connectie."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "galaxy-buds-multipoint" }]
dependencies = [
    "pystray>=0.19",
    "Pillow>=10",
]

[project.scripts]
budsmp-tray = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budsmp"]

[tool.uv]
managed = true
