[project]
name = "galaxy-buds-multipoint-tray"
version = "0.1.0"
description = "A compact Windows tray app that automatically applies the Galaxy Buds multipoint fix (asVer=2 via SPPSERVICE4) to every Bluetooth connection. Based on https://github.com/id6917824/galaxy-buds-multipoint."

readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "id6917824", email = "id6917824@github" },
    { name = "SvenS7", email = "SvenS7@github" },
    { name = "galaxy-buds-multipoint contributors" },
]
dependencies = [
    "pystray>=0.19",
    "Pillow>=10",
]

[project.scripts]
budsmp-tray = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budsmp"]

[tool.uv]
managed = true
